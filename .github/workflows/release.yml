name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Production deploy fires only when a web-v* release is cut. Vercel builds
      # main's HEAD (== the release commit at this point); a push racing the hook
      # is corrected by the next release.
      - name: Deploy apps/web to Vercel production
        if: ${{ steps.release.outputs['apps/web--release_created'] == 'true' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
